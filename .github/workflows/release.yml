name: Release

# Dispatch-only release. Never auto-runs on tag/release so the shared
# Blacksmith free tier is not consumed by surprise release builds. The
# workflow stays local-by-default: an operator dispatches it after a manual
# `cargo publish`. See docs/adr/0001-pr-check-blacksmith-local-release.md.

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # Budget gate: release only runs when not in `off` mode. `thin` still
    # allows a manually dispatched release (operator intent), only PR Check
    # honors `thin`.
    if: vars.CI_BUDGET_MODE != 'off'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: blacksmith-4vcpu-windows-2025
            ext: .exe
          - target: x86_64-apple-darwin
            runner: macos-latest
            ext: ""
          - target: aarch64-apple-darwin
            runner: macos-latest
            ext: ""
          - target: x86_64-unknown-linux-gnu
            runner: blacksmith-4vcpu-ubuntu-2404
            ext: ""
          - target: aarch64-unknown-linux-gnu
            runner: blacksmith-4vcpu-ubuntu-2404
            ext: ""
            use_cross: true

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux keyring build deps
        if: runner.os == 'Linux' && !matrix.use_cross
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --features secure-storage --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --features secure-storage --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../linear-cli-${{ matrix.target }}.tar.gz linear-cli${{ matrix.ext }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../linear-cli-${{ matrix.target }}.zip linear-cli${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linear-cli-${{ matrix.target }}
          path: linear-cli-${{ matrix.target }}.*

  upload:
    name: Upload Release Assets
    needs: build
    runs-on: ubuntu-latest
    if: vars.CI_BUDGET_MODE != 'off'
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4

      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            linear-cli-*/linear-cli-*

  publish:
    name: Publish to crates.io
    needs: upload
    runs-on: ubuntu-latest
    if: vars.CI_BUDGET_MODE != 'off'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Publish to crates.io
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
